version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-deps:
        patterns:
          - "*"

  # Backend (.NET / NuGet)
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "backend"

  # Vehicle service (pip)
  - package-ecosystem: "pip"
    directory: "/vehicle-service"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "vehicle-service"

  # Docker base images — backend
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Docker base images — frontend
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Docker base images — vehicle-service
  - package-ecosystem: "docker"
    directory: "/vehicle-service"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
