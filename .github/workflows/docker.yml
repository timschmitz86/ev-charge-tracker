name: Version and Publish Docker Images

on:
  push:
    branches:
      - main

concurrency:
  group: component-image-publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ev-charge-tracker

jobs:
  version-components:
    name: Version changed components
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      backend_changed: ${{ steps.version.outputs.backend_changed }}
      backend_version: ${{ steps.version.outputs.backend_version }}
      frontend_changed: ${{ steps.version.outputs.frontend_changed }}
      frontend_version: ${{ steps.version.outputs.frontend_version }}
      vehicle_service_changed: ${{ steps.version.outputs.vehicle_service_changed }}
      vehicle_service_version: ${{ steps.version.outputs.vehicle_service_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create component version tags
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          version_component() {
            local component="$1"
            local path="$2"
            local output_name="$3"
            local changed=false
            local existing_tag=""
            local latest_tag=""
            local version=""

            if grep -qE "^${path}/" <<< "$changed_files"; then
              changed=true
              existing_tag="$(git tag --points-at "$HEAD_SHA" --list "${component}-v*" --sort=-version:refname | head -n 1)"

              if [[ -n "$existing_tag" ]]; then
                version="${existing_tag#"${component}-v"}"
                echo "Reusing ${existing_tag} for ${component}."
              else
                latest_tag="$(git tag --merged "$HEAD_SHA" --list "${component}-v*" --sort=-version:refname | head -n 1)"
                if [[ -z "$latest_tag" ]]; then
                  version="0.0.1"
                else
                  version="${latest_tag#"${component}-v"}"
                  IFS=. read -r major minor patch <<< "$version"
                  version="${major}.${minor}.$((patch + 1))"
                fi

                git tag -a "${component}-v${version}" "$HEAD_SHA" -m "${component} ${version}"
                git push origin "${component}-v${version}"
                echo "Created ${component}-v${version}."
              fi
            fi

            echo "${output_name}_changed=${changed}" >> "$GITHUB_OUTPUT"
            echo "${output_name}_version=${version}" >> "$GITHUB_OUTPUT"
          }

          version_component backend backend backend
          version_component frontend frontend frontend
          version_component vehicle-service vehicle-service vehicle_service

  build-backend:
    name: Backend
    needs: version-components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.version-components.outputs.backend_version }},enable=${{ needs.version-components.outputs.backend_changed == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Frontend
    needs: version-components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.version-components.outputs.frontend_version }},enable=${{ needs.version-components.outputs.frontend_changed == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-vehicle-service:
    name: Vehicle Service
    needs: version-components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-vehicle-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.version-components.outputs.vehicle_service_version }},enable=${{ needs.version-components.outputs.vehicle_service_changed == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: ./vehicle-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
