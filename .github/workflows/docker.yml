name: Build and Push Docker Images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ev-charge-tracker

jobs:
  build-smoke:
    name: Build Smoke (${{ matrix.service.name }})
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            image: backend
          - name: frontend
            context: ./frontend
            image: frontend
          - name: vehicle-service
            context: ./vehicle-service
            image: vehicle-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ev-charge-tracker/${{ matrix.service.image }}:smoke-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        run: |
          docker run -d --name smoke-${{ matrix.service.name }} ev-charge-tracker/${{ matrix.service.image }}:smoke-${{ github.sha }}
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-${{ matrix.service.name }})" != "true" ]; then
            echo "Container failed to stay running for ${{ matrix.service.name }}"
            docker logs smoke-${{ matrix.service.name }}
            exit 1
          fi
          echo "Smoke test passed for ${{ matrix.service.name }}"

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f smoke-${{ matrix.service.name }} || true

  publish:
    name: Publish (${{ matrix.service.name }})
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            image: backend
          - name: frontend
            context: ./frontend
            image: frontend
          - name: vehicle-service
            context: ./vehicle-service
            image: vehicle-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
