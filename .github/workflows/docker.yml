name: Build and Push Docker Images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to (re)publish images for (e.g. v1.0.1)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ev-charge-tracker

jobs:
  build-smoke:
    name: Build Smoke (${{ matrix.service.name }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            image: backend
          - name: frontend
            context: ./frontend
            image: frontend
          - name: vehicle-service
            context: ./vehicle-service
            image: vehicle-service
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ev-charge-tracker/${{ matrix.service.image }}:smoke-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.service.name }}" = "frontend" ]; then
            EXTRA_ARGS="--add-host backend:127.0.0.1"
          fi

          docker run -d $EXTRA_ARGS --name smoke-${{ matrix.service.name }} ev-charge-tracker/${{ matrix.service.image }}:smoke-${{ github.sha }}
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-${{ matrix.service.name }})" != "true" ]; then
            echo "Container failed to stay running for ${{ matrix.service.name }}"
            docker logs smoke-${{ matrix.service.name }}
            exit 1
          fi
          echo "Smoke test passed for ${{ matrix.service.name }}"

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f smoke-${{ matrix.service.name }} || true

  publish:
    name: Publish (${{ matrix.service.name }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            image: backend
          - name: frontend
            context: ./frontend
            image: frontend
          - name: vehicle-service
            context: ./vehicle-service
            image: vehicle-service
    steps:
      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.value }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.image }}
          tags: |
            type=raw,value=${{ steps.release_tag.outputs.value }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release-image-artifact:
    name: Publish release image artifact
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate image reference manifest
        run: |
          TAG=${{ steps.release_tag.outputs.value }}
          cat > release-images.txt <<EOF
          Docker images for ${TAG}

          ghcr.io/${{ github.repository_owner }}/ev-charge-tracker-backend:${TAG}
          ghcr.io/${{ github.repository_owner }}/ev-charge-tracker-frontend:${TAG}
          ghcr.io/${{ github.repository_owner }}/ev-charge-tracker-vehicle-service:${TAG}

          Also published with tags:
          - latest
          - sha-<commit-short>
          EOF

      - name: Ensure release exists and upload artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.release_tag.outputs.value }}
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Release $TAG" --notes "Release created by docker publish workflow."
          gh release upload "$TAG" release-images.txt --clobber
