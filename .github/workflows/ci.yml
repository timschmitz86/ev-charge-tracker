name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build backend
        run: dotnet build backend/CarCharge.Api/CarCharge.Api.csproj --configuration Release
      - name: Build backend tests
        run: dotnet build backend/CarCharge.Api.Tests/CarCharge.Api.Tests.csproj --configuration Release
      - name: Run backend tests
        run: dotnet test backend/CarCharge.Api.Tests/CarCharge.Api.Tests.csproj --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start frontend preview server
        run: |
          cd frontend
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ev-charge-tracker-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null 2>&1; then
              echo "Frontend preview server is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
      - name: Run frontend Playwright tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SKIP_WEBSERVER: "1"

  vehicle-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install vehicle service deps
        run: pip install -r vehicle-service/requirements.txt
      - name: Install pytest
        run: pip install pytest
      - name: Run vehicle service tests
        run: pytest vehicle-service/tests/
