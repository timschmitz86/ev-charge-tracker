name: Auto Version

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: auto-version-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ev-charge-tracker

jobs:
  tag:
    name: Bump patch version
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.new_tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          git fetch --tags
          LATEST=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: new_tag
        run: |
          VERSION="${{ steps.latest_tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.new_tag.outputs.tag }}
          git push origin ${{ steps.new_tag.outputs.tag }}

  release:
    name: Create GitHub Release
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Release ${{ needs.tag.outputs.tag }}
          body: |
            Automated release for ${{ needs.tag.outputs.tag }}.

            See auto-generated notes below for full change details.
          generate_release_notes: true

  publish-images:
    name: Publish image (${{ matrix.service.name }})
    needs:
      - tag
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            image: backend
          - name: frontend
            context: ./frontend
            image: frontend
          - name: vehicle-service
            context: ./vehicle-service
            image: vehicle-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.image }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.tag }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  attach-release-image-artifact:
    name: Attach image artifact to release
    needs:
      - tag
      - publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate image reference manifest
        run: |
          TAG=${{ needs.tag.outputs.tag }}
          cat > release-images.txt <<EOF
          Docker images for ${TAG}

          ghcr.io/${{ github.repository_owner }}/ev-charge-tracker-backend:${TAG}
          ghcr.io/${{ github.repository_owner }}/ev-charge-tracker-frontend:${TAG}
          ghcr.io/${{ github.repository_owner }}/ev-charge-tracker-vehicle-service:${TAG}

          Also published with tags:
          - latest
          - sha-<commit-short>
          EOF

      - name: Upload release image artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.tag.outputs.tag }}" release-images.txt --clobber
